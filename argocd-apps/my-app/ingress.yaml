apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: computer-academy-webapp
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: computer-academy.devsecops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: computer-academy-webapp
                port:
                  number: 80
