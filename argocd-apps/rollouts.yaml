apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: computer-academy
  namespace: computer-academy
spec:
  replicas: 2  # ← ADDED (critical!)
  selector:
    matchLabels:
      app: computer-academy
  strategy:
    canary:
      canaryService: computer-academy-canary
      stableService: computer-academy-stable
      # REMOVED nginx (use simple NodePort instead)
      steps:
      - setWeight: 20
      - pause: {duration: 60}   # 1min (faster testing)
      - setWeight: 40
      - pause: {duration: 60}
      - setWeight: 60
      - pause: {duration: 60}
      - setWeight: 80
      - pause: {duration: 60}
      - setWeight: 100
  template:
    metadata:
      labels:
        app: computer-academy
    spec:
      containers:
      - name: computer-academy
        image: ketanmahajan24/computer-academy-webapp:165
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: MONGO_URL
          value: "mongodb://10.0.2.177:27017/computer-academy"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
