apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: computer-academy-ingress
  namespace: computer-academy
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: computer-academy.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: computer-academy-service
                port:
                  number: 80
