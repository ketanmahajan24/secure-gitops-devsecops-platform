# argocd-apps/canary-services.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: computer-academy-stable  # Rollout stable traffic
  namespace: computer-academy
spec:
  selector:
    app: computer-academy
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: computer-academy-canary   # Rollout canary traffic
  namespace: computer-academy
spec:
  selector:
    app: computer-academy
  ports:
  - port: 80
    targetPort: 3000
---
# YOUR EXISTING EXTERNAL SERVICE (Keep!)
apiVersion: v1
kind: Service
metadata:
  name: computer-academy-external
  namespace: computer-academy
spec:
  type: NodePort
  selector:
    app: computer-academy
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 31979
