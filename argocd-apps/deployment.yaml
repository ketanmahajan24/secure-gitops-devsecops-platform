spec:
  template:
    spec:
      containers:
      - name: computer-academy
        image: ketanmahajan24/computer-academy-webapp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        # ADD THIS MONGODB CONNECTION
        - name: MONGO_URL
          value: "mongodb://10.0.2.177:27017/computer-academy"
        # Health checks
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
