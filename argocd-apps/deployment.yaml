apiVersion: apps/v1
kind: Deployment
metadata:
  name: computer-academy
  namespace: computer-academy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: computer-academy
  template:
    metadata:
      labels:
        app: computer-academy
    spec:
      containers:
      - name: computer-academy
        image: ketanmahajan24/computer-academy-webapp:${BUILD_NUMBER}  # ← Matches Jenkins!
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: MONGO_URL          # ← FIXED: Matches your Jenkins + app
          value: "mongodb://10.0.2.177:27017/computer-academy"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
